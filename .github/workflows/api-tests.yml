name: API Tests

on:
  # Executa todos os dias às 09:00 no horário de Brasília (9:00 UTC)
  schedule:
    - cron: "0 9 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v7

      - name: Aguarda o ServeRest responder
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/produtos > /dev/null && break
            echo "Aguardando ServeRest subir... (tentativa $i)"
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno tests
        working-directory: ./collection
        run: bru run --env local --reporter-junit reports/results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-report
          path: collection/reports/results.xml