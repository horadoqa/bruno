name: API Tests

on:
  schedule:
    - cron: "0 12 * * *" 

  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Aguarda o ServeRest responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/produtos > /dev/null; then
              echo "ServeRest está disponível!"
              break
            fi

            echo "Aguardando ServeRest subir... (tentativa $i)"
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Bruno version
        run: bru --version

      - name: Run Bruno tests
        working-directory: ./collection
        run: |
          mkdir -p reports
          bru run \
            --env local \
            --reporter-junit reports/results.xml

      - name: Verifica relatório
        if: always()
        run: |
          echo "Conteúdo de collection/reports:"
          ls -lah collection/reports/ || true

          echo "Procurando results.xml:"
          find . -name "results.xml" -type f -print

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-report
          path: ./collection/reports/results.xml
          if-no-files-found: warn
